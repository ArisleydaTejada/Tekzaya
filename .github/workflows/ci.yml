name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Las pruebas de la API son de integración: hablan con Mongo de verdad, que es
    # donde viven los filtros de permisos y de notas internas que hay que probar.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test
